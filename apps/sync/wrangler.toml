name = "asu-sync"
main = "src/index.ts"
compatibility_date = "2025-03-14"
workers_dev = false

[[routes]]
pattern = "sync.xn--as-yka.app"
custom_domain = true

[durable_objects]
bindings = [
  { name = "WEBSOCKET_SERVER", class_name = "WebSocketServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketServer"]

[[d1_databases]]
binding = "DB"
database_name = "asu-sync"
database_id = "344e7db9-a455-47ff-8e1e-a662f26332a3"

[placement]
mode = "smart"
